name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source && mkdir -p source

          # ابحث عن أحدث ZIP في المستودع يحتوي مشروع أندرويد (settings.gradle.kts)
          best=""; best_ts=-1
          while IFS= read -r -d '' z; do
            names=$(unzip -Z1 "$z" 2>/dev/null || true)
            if grep -q 'settings\.gradle\.kts$' <<< "$names"; then
              ts=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
              ts=${ts:-0}
              if [ "$ts" -gt "$best_ts" ]; then best="$z"; best_ts=$ts; fi
            fi
          done < <(find . -path ./.git -prune -o -path ./source -prune -o -type f -iname '*.zip' -print0)

          if [ -z "$best" ]; then
            echo "::error::No ZIP containing settings.gradle.kts was found in the repository"
            exit 1
          fi
          echo "Using ZIP: $best"

          unzip -q -o "$best" -d source

          # إصلاح الصلاحيات (الأرشيف المضغوط من الهاتف قد يحمل صلاحيات صفرية)
          chmod -R u+rwX source

          # أقرب settings.gradle.kts للجذر = مجلد المشروع
          settings=$(find source -name settings.gradle.kts | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          proj=$(dirname "$settings")
          echo "PROJECT_DIR=$proj" >> "$GITHUB_ENV"
          echo "Project dir: $proj"

          echo "--- assets ---"
          ls -l "$proj/app/src/main/assets" || echo "::warning::assets folder not found"
          [ -f "$proj/app/src/main/assets/focuslock_visual_model.tflite" ] || echo "::warning::focuslock_visual_model.tflite missing"
          [ -f "$proj/app/src/main/assets/nudenet_320n_640_fp16.tflite" ] || echo "::warning::nudenet_320n_640_fp16.tflite missing (body detector disabled)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
