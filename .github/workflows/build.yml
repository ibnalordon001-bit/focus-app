
name: Build FocusLock APK from uploaded ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=()
          for file in ./*.zip; do
            if unzip -Z1 "$file" | grep -qE '(^|/)settings\.gradle\.kts$'; then
              candidates+=("$file")
            fi
          done
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "لم أجد ZIP يحتوي مشروع Android."
            exit 1
          fi
          if [ "${#candidates[@]}" -gt 1 ]; then
            printf 'وجدت أكثر من ZIP صالح: %s\n' "${candidates[@]}"
            echo "اترك ملف ZIP الخاص بالمشروع المطلوب فقط."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "${candidates[0]}" -d "$GITHUB_WORKSPACE/source"
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/source" -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
